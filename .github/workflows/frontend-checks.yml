name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test frontend behavior
        run: npm test
      - name: Check types and build
        run: npm run build
      - name: Build isolated public showcase
        env:
          VITE_API_MODE: http
          VITE_API_TOKEN: banipmatch-public-build-must-not-include-this
        run: npm run build:showcase
      - name: Verify static publish boundary
        run: python3 ../tools/check_showcase_dist.py
      - name: Save public showcase files for review (does not publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: banipmatch-showcase-${{ github.sha }}
          path: frontend/dist-showcase/
          if-no-files-found: error
          retention-days: 7
