name: Development and backend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r "docs/development/v0.1/검수/requirements-validation.txt"
      - name: Validate contracts, examples, and in-memory DB
        run: python tools/check_development.py

  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Frozen evaluation checks inspect its historical source commit.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt -r backend/data/requirements.txt
      - name: Test data inputs, API, persistence, and B0-B3 engine
        run: python -m pytest -q
      - name: Verify frozen showcase evidence without rerunning the solver
        # 공개 사본은 이메일을 지우려고 이력을 다시 써서 평가 실행 커밋이 없다. 있을 때만 대조한다.
        run: |
          if git cat-file -e "0d2640bec9886fe344166809123bc9a2cc19bb92^{commit}" 2>/dev/null; then
            python tools/build_showcase_evidence.py --check
          else
            echo "평가 실행 커밋이 없는 공개 사본이라 증거 대조를 건너뜀(원 저장소·제출 ZIP에서 확인)"
          fi
