name: Development contract checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r "docs/development/v0.1/검수/requirements-validation.txt"
      - name: Validate contracts, examples, and in-memory DB
        run: python tools/check_development.py
